<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — Victoria Chen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&family=Tenor+Sans&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <main class="page page--single">
      <p class="page-nav">
        <a class="piece-title linked" href="../">Home</a>
      </p>
      <section class="contact" aria-label="Contact">
        <div class="contact-grid">
          <img
            class="peony"
            src="../assets/peony.png"
            alt=""
            aria-hidden="true"
          />

          <div class="contact-copy">
            <h1 class="contact-title">Where to find<br />me</h1>

            <div class="email-block">
              <p class="label">Email</p>
              <a class="email" href="mailto:vcvickychen732@gmail.com"
                >vcvickychen732@gmail.com</a
              >
            </div>

            <div class="social-links">
              <a
                href="https://www.tiktok.com/@chickyven?is_from_webapp=1&sender_device=pc"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="TikTok"
              >
                <img src="../assets/tiktok.png" alt="" />
              </a>
              <a
                href="http://instagram.com/chicky.ven"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Instagram"
              >
                <img src="../assets/instagram.png" alt="" />
              </a>
              <a
                href="http://chickyven.substack.com/"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Substack"
              >
                <img src="../assets/substack.png" alt="" />
              </a>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
