<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Victoria Chen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&family=Tenor+Sans&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page page--single">
      <section class="hero" aria-label="Portfolio">
        <div class="hero-grid">
          <figure class="portrait-wrap">
            <img
              class="portrait"
              src="assets/portrait.jpg"
              alt="Victoria Chen smiling outdoors with cherry blossoms"
            />
          </figure>

          <div class="hero-copy">
            <h1 class="name">Victoria<br />Chen</h1>

            <div class="block">
              <h2 class="section-title">Writer Portfolio</h2>
              <ul class="portfolio-list">
                <li class="portfolio-item">
                  <a
                    class="piece-title linked"
                    href="https://bhreview.org/articles/endings/"
                    target="_blank"
                    rel="noopener noreferrer"
                    >Endings</a
                  >
                  <span class="publication">The Bellingham Review</span>
                </li>
                <li class="portfolio-item">
                  <a
                    class="piece-title linked"
                    href="https://forgelitmag.com/2025/10/13/on-backsliding/"
                    target="_blank"
                    rel="noopener noreferrer"
                    >On Backsliding</a
                  >
                  <span class="publication">The Forge Literary Magazine</span>
                </li>
                <li class="portfolio-item">
                  <a
                    class="piece-title linked"
                    href="https://www.artwifemag.com/short-stories/at-coffee"
                    target="_blank"
                    rel="noopener noreferrer"
                    >At Coffee</a
                  >
                  <span class="publication">Artwife Magazine</span>
                </li>
                <li class="portfolio-item">
                  <a
                    class="piece-title linked"
                    href="https://litbreak.com/the-immovable-i/"
                    target="_blank"
                    rel="noopener noreferrer"
                    >The Immovable I</a
                  >
                  <span class="publication">Litbreak Magazine</span>
                </li>
              </ul>
            </div>

            <div class="block">
              <h2 class="section-title">Accomplishments</h2>
              <p class="accomplishment">
                Bread Loaf Writers&rsquo; Conference Participant (2026)
              </p>
            </div>

            <p class="page-nav">
              <a class="piece-title linked" href="contact/index.html"
                >Contact</a
              >
            </p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
